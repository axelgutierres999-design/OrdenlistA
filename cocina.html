<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OrdenLista | Producción / Cocina</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
      .panel-cocina { padding: 2rem 0; }
      .columna-kanban {
          background-color: #f4f7f6;
          padding: 1rem;
          border-radius: 8px;
          min-height: 70vh;
          border: 1px solid #e0e0e0;
      }
      .tarjeta-orden {
          background-color: white;
          border-radius: 6px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          animation: fadeIn 0.3s ease;
          padding: 1rem;
          margin-bottom: 1.2rem;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .nav-botones a.activo {
          background: var(--color-acento-principal);
          color: white;
      }
      h3 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
      /* --- AJUSTES PARA NAVEGACIÓN MÓVIL --- */
    .nav-inicio {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
    }

    .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .hamburger {
        display: none; /* Oculto en PC */
        background: none;
        border: none;
        font-size: 1.5rem;
        color: #333;
        cursor: pointer;
    }

    #menuNavegacion {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 1rem;
    }

    .btn-ajustes-manual {
        border: 1px solid #10ad93 !important;
        color: #10ad93 !important;
        padding: 5px 12px !important;
        font-size: 0.85rem !important;
        border-radius: 8px;
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .hamburger { display: block; }
        .hide-mobile { display: none; }
        #menuNavegacion {
            display: none;
            width: 100%;
            flex-direction: column;
            order: 3;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        #menuNavegacion.show { display: flex; }
        #menuNavegacion li { width: 100%; text-align: center; }
    }
    @keyframes pulseVoz {
        0%,100% { opacity:1; transform:scale(1); }
        50%      { opacity:0.7; transform:scale(1.05); }
    }
    
  </style>
</head>
<body>
<nav class="nav-inicio">
  <div class="brand-group">
    <strong style="font-size: 1.3rem; color: #10ad93;">☕ OrdenLista</strong>
    <span class="hide-mobile" style="color: #888;">| Monitor de cocina</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <a href="ajustes.html" role="button" class="contrast outline btn-ajustes-manual">
      ⚙️ <span class="hide-mobile">Ajustes</span>
    </a>
    <button class="hamburger" onclick="toggleNav()">☰</button>
  </div>

  <ul id="menuNavegacion" class="nav-botones"></ul>
</nav>

  <main class="container panel-cocina">
      <header style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
  <div>
    <h1 style="margin:0;">🛠️ Monitor de Producción</h1>
    <p style="margin:4px 0 0;">Los pedidos finalizados descuentan automáticamente el stock.</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button id="btnVoz"
      style="background:#6c3483;color:white;border:none;border-radius:12px;
             padding:10px 18px;font-size:0.9rem;font-weight:700;cursor:pointer;
             display:flex;align-items:center;gap:8px;">
      🔇 Voz: OFF
    </button>
    <div id="indicadorVoz" style="display:none;background:#8e44ad;color:white;
         padding:6px 12px;border-radius:8px;font-size:0.8rem;font-weight:600;
         animation:pulseVoz 1.5s infinite;">
      🔊 Leyendo...
    </div>
  </div>
</header>

      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
          <div>
              <h3 style="color: #c0392b;">🔥 Entrantes</h3>
              <div class="columna-kanban" id="tareasPendientes"></div>
          </div>

          <div>
              <h3 style="color: #f39c12;">🍳 Preparando</h3>
              <div class="columna-kanban" id="tareasEnProceso"></div>
          </div>

          <div>
              <h3 style="color: #27ae60;">✅ Listo para Entrega</h3>
              <div class="columna-kanban" id="tareasTerminadas"></div>
          </div>
      </div>
  </main>
  
  <script>
  function toggleNav() {
      const menu = document.getElementById('menuNavegacion');
      menu.classList.toggle('show');
  }
</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/logout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cocina.js"></script>

</body>
</html>

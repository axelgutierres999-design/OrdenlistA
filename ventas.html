<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analíticas | OrdenLista</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="css/app.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- ESTILOS GENERALES --- */
        body { padding-bottom: 80px; }

        /* --- NAVEGACIÓN RESPONSIVE --- */
        .nav-inicio {
            background: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.5rem 1rem;
            /* Esto permite que los elementos se muevan libremente */
            display: flex; 
            flex-wrap: wrap; 
            align-items: center;
            justify-content: space-between;
        }

        /* Grupo del Logo y Título */
        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Botón Hamburguesa (☰) */
        .hamburger {
            display: none; /* Oculto en PC */
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #333;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        /* Menú de Navegación (Donde app.js inyecta los botones) */
        #menuNavegacion {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 1rem;
            align-items: center;
        }

        /* --- ESTILOS ANALÍTICAS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-stat { 
            background: white; 
            border-radius: 16px; 
            padding: 1.2rem; 
            text-align: center;
            border-bottom: 4px solid #10ad93;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .panel-blanco { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 16px; 
            margin-top: 1rem; 
            border: 1px solid #eef0f2;
        }

        .chart-container { 
            position: relative; 
            height: 300px; 
            width: 100%; 
            margin-top: 1rem;
        }

        /* --- REGLAS MÓVILES (Celular) --- */
        @media (max-width: 768px) {
            .hide-mobile { display: none; }
            
            /* Mostrar botón hamburguesa */
            .hamburger { display: block; }

            /* Ocultar menú por defecto en móvil */
            #menuNavegacion {
                display: none; 
                width: 100%;
                flex-direction: column;
                padding-top: 1rem;
                border-top: 1px solid #eee;
                margin-top: 10px;
            }

            /* Clase para mostrar el menú cuando se hace click */
            #menuNavegacion.show {
                display: flex;
            }

            /* Estilo de los botones del menú en móvil */
            #menuNavegacion li {
                width: 100%;
                text-align: center;
                margin-bottom: 5px;
            }
            #menuNavegacion a, #menuNavegacion button {
                width: 100%;
                display: block;
                padding: 10px;
            }

            /* Ajustes de Grids */
            .main-grid { grid-template-columns: 1fr !important; }
            
            .action-buttons {
                flex-direction: column;
                gap: 0.8rem;
            }
            .action-buttons button { width: 100%; }
        }

        @media print { 
            .nav-inicio, button, .chart-container { display: none !important; } 
            .panel-blanco { border: none; padding: 0; box-shadow: none; }
        }
    </style>
</head>
<body style="background-color: #f9fbfd;">

    <nav class="nav-inicio">
        <div class="brand-group">
            <strong style="font-size: 1.3rem; color: #10ad93;">☕ OrdenLista</strong>
            <span class="hide-mobile" style="color: #888;">| Monitor</span>
        </div>

        <button class="hamburger" onclick="toggleNav()">☰</button>

        <ul id="menuNavegacion">
            <li>
                <a href="ajustes.html" role="button" class="contrast outline"
                   style="border-color: #10ad93; color: #10ad93; padding: 5px 15px; font-size: 0.9rem;">
                   ⚙️ Ajustes
                </a>
            </li>
        </ul>
    </nav>

    <main class="container" style="margin-top: 20px;">
        <header>
            <h1>📊 Corte de Caja</h1>
            <p style="color: #666;">Resumen de movimientos del día.</p>
        </header>

        <section class="stats-grid">
            <div class="card-stat">
                <small style="color: #888;">TOTAL HOY</small>
                <h2 id="totalDia" style="color: #10ad93;">$0.00</h2>
            </div>
            <div class="card-stat" style="border-bottom-color: #2ecc71;">
                <small style="color: #888;">EFECTIVO</small>
                <h2 id="totalEfectivo" style="color: #2ecc71;">$0.00</h2>
            </div>
            <div class="card-stat" style="border-bottom-color: #3498db;">
                <small style="color: #888;">TARJETA</small>
                <h2 id="totalTarjeta" style="color: #3498db;">$0.00</h2>
            </div>
            <div class="card-stat" style="border-bottom-color: #9b59b6;">
                <small style="color: #888;"># VENTAS</small>
                <h2 id="numVentasDia" style="color: #333;">0</h2>
            </div>
             <div class="card-stat" style="border-bottom-color: #f39c12;">
                <small style="color: #888;">TICKET PROM.</small>
                <h2 id="ticketPromedio" style="color: #f39c12;">$0.00</h2>
            </div>
        </section>

        <div class="grid main-grid">
            <div class="panel-blanco">
                <h4 style="text-align:center; margin-bottom: 0;">📈 Top Productos</h4>
                <div class="chart-container">
                    <canvas id="graficoCategorias"></canvas>
                </div>
            </div>

            <div class="panel-blanco">
                <h4>📋 Últimas Ventas</h4>
                <figure style="max-height: 400px; overflow: auto;">
                    <table role="grid">
                        <thead style="position: sticky; top: 0; background: white; z-index: 1;">
                            <tr>
                                <th>#</th>
                                <th>Mesa</th>
                                <th>Total</th>
                                <th>Pago</th>
                            </tr>
                        </thead>
                        <tbody id="listaUltimasVentas">
                            <tr>
                                <td colspan="4" style="text-align:center; color: #888; padding: 2rem;">
                                    Cargando...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </figure>
            </div>
        </div>

        <div class="action-buttons" style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; margin-bottom: 3rem;">
            <button class="outline secondary" onclick="location.reload()">
                🔄 Actualizar
            </button>
            
            <button class="contrast" onclick="realizarCorteCaja()" style="background-color: #10ad93; border: none;">
                💰 Realizar Corte de Caja
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/app.js"></script>
    <script src="js/estadisticas.js"></script>

    <script>
        function toggleNav() {
            const menu = document.getElementById('menuNavegacion');
            menu.classList.toggle('show');
        }
    </script>
</body>
</html>
